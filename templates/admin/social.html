{% extends "base.html" %}
{% block title %}Соцсети{% endblock %}
{% block content %}
<div class="container" style="max-width:720px;">
  <h1>Соцсети и реклама</h1>
  <p><a href="{{ url_for('admin_dashboard') }}">Панель</a></p>
  <div class="card">
    <form method="POST">
      <input type="hidden" name="action" value="add">
      <div class="form-group">
        <label>Сеть</label>
        <select name="network">
          <option value="instagram">Instagram</option>
          <option value="telegram">Telegram</option>
          <option value="facebook">Facebook</option>
          <option value="youtube">YouTube</option>
          <option value="tiktok">TikTok</option>
          <option value="other">Другое</option>
        </select>
      </div>
      <div class="form-group"><label>Название</label><input name="title" placeholder="ХГУ Instagram"></div>
      <div class="form-group"><label>Ссылка</label><input name="url" required placeholder="https://...">
      <label style="margin-top:8px;display:block;">Дата окончания рекламы (необяз.)</label>
      <input type="datetime-local" name="ends_at">
</div>
      <button class="btn btn-primary" type="submit">Добавить</button>
    </form>
  </div>
  <div class="card">
    {% for l in links %}
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);">
      <div><strong>{{ l.network }}</strong> — {{ l.title }}<br><a href="{{ l.url }}" target="_blank">{{ l.url }}</a></div>
      <form method="POST"><input type="hidden" name="action" value="delete"><input type="hidden" name="id" value="{{ l.id }}"><button class="btn btn-danger btn-sm">Удалить</button></form>
    </div>
    {% else %}<p>Пока пусто</p>{% endfor %}
    <form method="POST" style="margin-top:12px;">
      <input type="hidden" name="action" value="broadcast">
      <button class="btn btn-accent" type="submit">Запустить рекламу у всех студентов</button>
    </form>
  </div>
</div>
{% endblock %}
